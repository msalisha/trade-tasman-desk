name: Refresh data and deploy

on:
  schedule:
    # Every Monday 18:00 UTC = Tuesday early morning in NZ and Australia,
    # after NZ Customs' nightly file update.
    - cron: "0 18 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    # Only the scheduled and manual runs refresh data; a push just redeploys.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh NZ tariff
        id: nz
        continue-on-error: true
        run: |
          python3 scripts/fetch_nz.py "$RUNNER_TEMP/nz"
          python3 scripts/build_nz.py "$RUNNER_TEMP/nz"
          python3 scripts/validate_data.py nz || { git checkout -- data/nz_tariff.json; exit 1; }

      - name: Refresh Australian tariff
        id: au
        continue-on-error: true
        run: |
          python3 scripts/fetch_au.py "$RUNNER_TEMP/au"
          python3 scripts/build_au.py "$RUNNER_TEMP/au"
          python3 scripts/validate_data.py au || { git checkout -- data/au_tariff.json; exit 1; }

      - name: Check agreement lists
        id: watch
        continue-on-error: true
        run: python3 scripts/check_agreements.py "$RUNNER_TEMP/agreement-changes.md"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue for agreement changes
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Agreement list changed ($(date -u +%Y-%m-%d))" \
            --body-file "$RUNNER_TEMP/agreement-changes.md"

      - name: Open an issue if a refresh failed
        if: steps.nz.outcome == 'failure' || steps.au.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          NZ: ${{ steps.nz.outcome }}
          AU: ${{ steps.au.outcome }}
        run: |
          gh issue create --title "Tariff refresh failed ($(date -u +%Y-%m-%d))" --body \
            "NZ tariff: $NZ. Australian tariff: $AU. The site kept the previous data for any failed source. See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  deploy:
    needs: refresh
    # Run after a refresh (even if it was skipped on push), but not if it crashed outright.
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 scripts/build_site.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
